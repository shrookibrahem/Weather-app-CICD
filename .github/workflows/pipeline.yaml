name: Weather-App-Ci

on:
    workflow_dispatch:

jobs:
  linting:
    runs-on: ubuntu-latest

    
    
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
           python-version: '3.9'

      - name: Run Linting
        run: |
            python -m venv .venv
            source .venv/bin/activate
            pip install flake8
            flake8 weather/main.py


  test:
    needs: linting
    runs-on: ubuntu-latest
            
            

    
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
           python-version: '3.9'

      - name: Run Testing
        run: |
            python -m venv .venv
            source .venv/bin/activate
            pip install -r weather/requirements.txt
            python -m unittest discover weather


  Build:
    runs-on: ubuntu-latest
    needs: [linting, test]
    steps:
     -   name: only test
         run : echo "Done"




