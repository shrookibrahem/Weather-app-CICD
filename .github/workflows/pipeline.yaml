name: Weather-App-CiCD

on: push

permissions:
  contents: write
    

jobs:
  CI-Weathr:

    runs-on: ubuntu-latest

    
    
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
           python-version: '3.9'


           
      - name: Linting
        run: |
            python -m venv .venv
            source .venv/bin/activate
            pip install flake8
            flake8 weather/main.py

    
      
      - name: Testing
        run: |
            python -m venv .venv
            source .venv/bin/activate
            pip install -r weather/requirements.txt
            python -m unittest discover weather


  
  CI-UI:

    runs-on: ubuntu-latest

    
    
    steps:
      - uses: actions/checkout@v3

      - name: Install Trivy 
        run: |
          wget https://github.com/aquasecurity/trivy/releases/download/v0.52.1/trivy_0.52.1_Linux-64bit.tar.gz
          tar -xzf trivy_0.52.1_Linux-64bit.tar.gz

      - name: Scan code  with trivy
        run: |
            ./trivy fs ./UI

  CI-AUTH:
     runs-on: ubuntu-latest
     steps:
         - uses: actions/checkout@v3

         - name: Set up Go
           uses: actions/setup-go@v4
           with:
             go-version: '1.23'
           

         - name: Scan Cod 
           run: go vet ./authdb/authdb.go
           working-directory: auth

         - name: Install golangci-lint
           run: go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest

         - name: Linting Auth 
           run: golangci-lint run  ./authdb
           working-directory: auth
  Build:
      runs-on: ubuntu-latest
      needs: [CI-Weathr,CI-AUTH, CI-UI]
      steps:
        - uses: actions/checkout@v3

        -  name: Login to DockerHub
           uses: docker/login-action@v1 
           with:
                username: ${{ secrets.DOCKER_USER}}
                password: ${{ secrets.DOCKER_TOKEN }}

        - name: Build and pushBackEnd
          id: build_Weather
          uses: docker/build-push-action@v6
          with:
            context: ./weather
            file: ./weather/Dockerfile
            push: true
            tags: saliibrahem/backend:${{ github.run_number }}  
            
        - name: Build and push FrontEnd
          id: build_UI
          uses: docker/build-push-action@v6
          with:
           context: ./UI
           file: ./UI/Dockerfile
           push: true
           tags: saliibrahem/frontend:${{ github.run_number }}
        
        - name: Build and push DB
          id: build_Auth
          uses: docker/build-push-action@v6
          with:
            context: ./auth
            file: ./auth/Dockerfile
            push: true
            tags: saliibrahem/db:${{ github.run_number }}
  preparing:
    runs-on: ubuntu-latest
    needs: [CI-Weathr,CI-AUTH, CI-UI,Build]
    steps:

      - uses: actions/checkout@v3

      - name: Replace Tags
        run : |
          sed -i "s/{{BACKEND_TAG}}/${{github.run_number}}/" kubernates/weathersvc/Deployment.yaml
          sed -i "s/{{FRONTEND_TAG}}/${{github.run_number}}/" kubernates/UI/Deployment.yaml
          sed -i "s/{{DB_TAG}}/${{github.run_number}}/" kubernates/AUTH/Deployment.yaml

      - name: Push updated manifest back to Git
        run: |
            git config --global user.name "${{ secrets.USER_NAME }}"
            git config --global user.email "${{ secrets.GM }}"
          
            git add kubernates/
            git commit -m "Update k8s manifest with tag ${{github.run_number}}"
            git push
         
